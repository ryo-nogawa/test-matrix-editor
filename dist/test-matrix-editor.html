<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>試験マトリクス作成支援ツール</title>
<style>
/* ---- styles.css ---- */
:root {
  --line: #cfd4db;
  --line-strong: #8a9099;
  --left-bg: #eef1f5;
  --head-bg: #e3e7ed;
  --warn-bg: #ffe3b3;
  --uncovered-bg: #fde0e0;
  --uncovered-text: #b3261e;
  --accent: #2b6fd6;
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  display: flex;
  flex-direction: column;
  margin: 0;
  font-family: "Meiryo", "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 14px;
  color: #222;
  background: #fff;
}

/* ---------- ツールバー ---------- */

.toolbar {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  border-bottom: 1px solid #c9ced6;
  background: #f7f8fa;
}

.toolbar button {
  padding: 6px 16px;
  border: 1px solid #9aa0a8;
  border-radius: 6px;
  background: #fff;
  font: inherit;
  cursor: pointer;
}

.toolbar button:disabled {
  color: #999;
  cursor: default;
}

/* ---------- 表 ---------- */

/* 表をスクロールする領域。固定表示（sticky）はこの領域に対して効く */
#app {
  flex: 1;
  overflow: auto;
}

.matrix {
  border-collapse: separate; /* collapse だと固定表示したセルの罫線が消えるため */
  border-spacing: 0;
}

.matrix th,
.matrix td {
  padding: 6px 8px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: #fff;
  vertical-align: middle;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* 空の行もつぶれないように、行の高さの最小値を決める */
.matrix td {
  height: 34px;
}

.matrix thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--head-bg);
  font-weight: 700;
  text-align: left;
}

/* 左側の条件の列：横にスクロールしても固定する */
.matrix .left {
  position: sticky;
  z-index: 1;
  background: var(--left-bg);
}

/* 左上の見出し：縦にも横にも固定する */
.matrix thead th.left {
  z-index: 3;
  background: var(--head-bg);
}

/* 左側と試験の列の境目 */
.matrix .value {
  border-right: 2px solid var(--line-strong);
}

.matrix .test-group {
  text-align: center;
}

.matrix .test-no {
  min-width: 44px;
  text-align: center;
  white-space: nowrap;
}

.matrix .mark {
  min-width: 44px;
  text-align: center;
}

.matrix .empty {
  color: #999;
  font-weight: 400;
}

/* ---------- 強調表示 ---------- */

/* 警告（読み込めたが、不明な記号や改変がある） */
.matrix td.warn,
.matrix tr.warn-row td.left {
  background: var(--warn-bg);
}

/* 網羅チェック（○ が1つも無い行・列） */
.matrix tr.uncovered td.value,
.matrix th.test-no.uncovered {
  background: var(--uncovered-bg);
  color: var(--uncovered-text);
}

/* ---------- 編集操作 ---------- */

.matrix .left,
.matrix .mark {
  cursor: pointer;
}

.matrix .left:hover,
.matrix .mark:hover {
  outline: 1px solid #9bb8e8;
  outline-offset: -1px;
}

/* クリック・右クリックしたセル */
.matrix .selected {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}

/* その場で編集する入力欄 */
.cell-input {
  width: 100%;
  padding: 2px 4px;
  border: 1px solid var(--accent);
  font: inherit;
}

/* 階層の列を追加する＋（階層の列の右端の見出し） */
/* ＋が右隣の「具体値」の見出しに隠れないよう、右端の階層の見出しを手前に出す */
.matrix thead th.last-level {
  z-index: 4;
}

.matrix .add-level {
  position: absolute;
  top: 50%;
  right: -11px;
  z-index: 4;
  transform: translateY(-50%);
  visibility: hidden; /* 隠している間は押せない（opacity と違い、誤って押されない） */
}

/* 左側の見出しにマウスを乗せたときだけ表示する（常に出ていると「具体値」の文字に重なるため） */
.matrix thead tr:has(th.left:hover) .add-level {
  visibility: visible;
}

/* 試験の列を右端に追加する＋ */
.matrix th.add-test {
  min-width: 36px;
  color: #444;
  font-size: 18px;
  text-align: center;
  cursor: pointer;
}

.matrix th.test-no.empty {
  cursor: pointer;
}

.matrix .add-level,
.insert-plus {
  width: 22px;
  height: 22px;
  padding: 0;
  border: 2px solid var(--accent);
  border-radius: 50%;
  background: #fff;
  color: #222;
  font: 700 14px/1 sans-serif;
  cursor: pointer;
}

/* 行・列の間に出す破線と＋ */
.insert-line {
  position: fixed;
  z-index: 10;
  border-top: 2px dashed var(--accent);
  pointer-events: none;
}

.insert-line.vertical {
  border-top: none;
  border-left: 2px dashed var(--accent);
}

.insert-plus {
  position: fixed;
  z-index: 11;
  transform: translate(-50%, -50%);
}

/* 印のプルダウンと右クリックメニュー */
.popup {
  position: fixed;
  z-index: 20;
  display: flex;
  flex-direction: column;
  min-width: 140px;
  padding: 4px;
  border: 1.5px solid var(--accent);
  border-radius: 6px;
  background: #fff;
  box-shadow: 0 4px 12px rgb(0 0 0 / 15%);
}

.popup[hidden] {
  display: none;
}

.popup button {
  padding: 6px 10px;
  border: none;
  border-radius: 4px;
  background: none;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.popup button:hover:not(:disabled) {
  background: #eef3fc;
}

.popup button:disabled {
  color: #aaa;
  cursor: default;
}

.popup hr {
  width: 100%;
  margin: 4px 0;
  border: none;
  border-top: 1px solid var(--line);
}

/* ---------- ダイアログ ---------- */

.dialog {
  width: min(480px, calc(100vw - 32px));
  padding: 20px 24px;
  border: 1px solid #b9bfc8;
  border-radius: 10px;
  box-shadow: 0 8px 24px rgb(0 0 0 / 20%);
}

.dialog.wide {
  width: min(860px, calc(100vw - 32px));
}

.dialog::backdrop {
  background: rgb(0 0 0 / 30%);
}

.dialog h2 {
  margin: 0 0 12px;
  font-size: 17px;
}

.dialog.error h2 {
  color: var(--uncovered-text);
}

.dialog.warning h2 {
  color: #9a5b00;
}

.dialog-body ul {
  margin: 8px 0 0;
  padding-left: 20px;
  line-height: 1.7;
}

.dialog-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 16px;
}

.dialog-buttons button {
  padding: 6px 16px;
  border: 1px solid #9aa0a8;
  border-radius: 6px;
  background: #fff;
  font: inherit;
  cursor: pointer;
}

.dialog-buttons button.primary {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
}

.markdown-area {
  width: 100%;
  height: 50vh;
  padding: 8px;
  border: 1px solid #b9bfc8;
  border-radius: 6px;
  font: 13px/1.5 Consolas, Menlo, monospace;
  white-space: pre;
}

.file-row {
  display: block;
  margin-bottom: 8px;
}

.toast {
  position: fixed;
  bottom: 40px;
  left: 50%;
  z-index: 30;
  padding: 8px 16px;
  border-radius: 6px;
  background: #333;
  color: #fff;
  transform: translateX(-50%);
}

.toast[hidden] {
  display: none;
}

/* ---------- ステータス ---------- */

.status {
  padding: 4px 16px;
  border-top: 1px solid #c9ced6;
  color: #666;
  font-size: 12px;
}

</style>
</head>
<body>
<header class="toolbar">
  <button type="button" data-action="export">Markdown出力</button>
  <button type="button" data-action="import">読み込み</button>
  <button type="button" data-action="copy-prompt">指示文コピー</button>
  <button type="button" data-action="undo" disabled>元に戻す</button>
  <button type="button" data-action="redo" disabled>やり直し</button>
</header>
<main id="app"></main>
<footer class="status" id="status"></footer>
<script>
// ---- docs/ai-prompt.md の指示文 ----
const PROMPT_TEMPLATE = "あなたはソフトウェアテストの設計者です。\n以下の「条件の表」をもとに試験ケースを設計し、試験項番の列を追加して、各セルに印を付けた表を返してください。\n\n# 表の読み方\n- 表の左側の列は、左から順に親・子・孫の階層になっている条件の定義です。\n- 試験項番の列の直前にある列は「具体値」で、その条件の具体的な値です。\n- 種類の列は、入力（事前条件）・機能（処理）・出力（結果）の分類です。\n\n# 試験ケースの考え方\n- 1つの試験項番（列）が、1つの試験ケースを表します。\n- 各試験ケースで、どの条件が成り立つかを印で表します。\n- 同じ親を持つ条件（例：同じ「項目」の下にある複数の「パターン」）は、1つの試験ケースの中では通常1つだけ選びます。\n- エラーになる条件（異常系）は、1つの試験ケースに1つだけ含めてください。正常系の条件と組み合わせ、どの条件でエラーになったかを区別できるようにします。\n- 機能の行は、表の上から下の順に処理されるものとみなします。\n- ある条件で処理が止まる場合（エラーで終了するなど）、それより後の処理の条件には「−」を付けます。\n- 入力・機能の行には、すべて少なくとも1つの試験ケースで「○」が付くようにしてください（出力の行は、次の「期待値の扱い」に従います）。\n- 不要な重複がないよう、できるだけ少ない試験ケースで網羅してください。\n\n# 期待値（種類が「出力（結果）」の行）の扱い\n- 期待値は、設計書・仕様書などの参考資料に書かれている内容に基づいてのみ記入してください。推測や一般的な慣例で記入してはいけません。\n- このメッセージに参考資料が添付または貼り付けられていない場合は、出力の行をすべて空欄にしてください。\n- 参考資料がある場合でも、資料から判断できない期待値は空欄にしてください。\n\n# 印の種類（この3種類以外は使わない）\n| 印 | 意味 |\n| --- | --- |\n| ○ | 確認する観点（この試験でこの条件が成り立つ・この結果を確認する） |\n| − | 手前の条件で処理が止まり、この条件には到達しない |\n| 空欄 | 該当しない（何も書かない） |\n\n# 出力の書式（厳守）\n1. Markdownの表を1つだけ返してください。表はコードブロック（```markdown）で囲んでください。\n2. 左側の列（見出し・値・行の順番・行の数）は一切変更しないでください。行の追加・削除・並べ替え・言い換え・省略をしないでください。\n3. 具体値の列の右に、試験項番の列を追加してください。\n4. 試験項番の見出しは、半角数字3桁の連番（001, 002, 003, …）にしてください。「試験項番」などの見出しは付けないでください。\n5. 見出しは1行だけにしてください。セルの結合はしないでください。\n6. すべての行で、列の数を見出し行と同じにしてください。空欄のセルも「|  |」として省略せずに書いてください。\n7. 印は「○」「−」「空欄」のみを使ってください。「×」「✓」「●」などは使わないでください。\n\n# 補足説明\n表のコードブロックの後に、各試験項番の狙いを「001: ～」の形の箇条書きで1行ずつ書いてください（表にはしないでください）。\n空欄にした期待値がある場合は、続けて「期待値の未記入」として、空欄にした理由と、記入するために必要な資料・情報を箇条書きで書いてください。\n\n# 例\n条件の表：\n| 種類 | 対象 | 項目 | パターン | 具体値 |\n| --- | --- | --- | --- | --- |\n| 入力 | ログインAPI | リクエスト | 必須項目あり | login() |\n| 機能 | 会員確認 | 会員情報の検索 | 見つかる | true |\n| 機能 | 会員確認 | 会員情報の検索 | 見つからない | false |\n| 機能 | 状態確認 | アカウント状態 | ロック中 | locked |\n| 出力 | レスポンス | 結果コード | エラー | ERR |\n\n返す表：\n| 種類 | 対象 | 項目 | パターン | 具体値 | 001 | 002 |\n| --- | --- | --- | --- | --- | --- | --- |\n| 入力 | ログインAPI | リクエスト | 必須項目あり | login() | ○ | ○ |\n| 機能 | 会員確認 | 会員情報の検索 | 見つかる | true |  | ○ |\n| 機能 | 会員確認 | 会員情報の検索 | 見つからない | false | ○ |  |\n| 機能 | 状態確認 | アカウント状態 | ロック中 | locked | − | ○ |\n| 出力 | レスポンス | 結果コード | エラー | ERR |  |  |\n\n- 001: 会員情報が見つからない場合（アカウント状態の確認には到達しない）\n- 002: 会員情報は見つかるが、アカウントがロック中の場合\n\n期待値の未記入：\n- 参考資料が渡されていないため、出力の行はすべて空欄にした\n- 記入には、会員情報が見つからない場合とアカウントがロック中の場合の応答仕様（結果コード）が分かる設計書が必要\n\n※ 上の例は書式の説明用で、参考資料がない場合の書き方です。実際の試験ケースは、下の条件の表（と、渡された参考資料）だけをもとに設計してください。\n\n# 条件の表\n{{MATRIX}}";

// ---- core/marks.js ----
// 印の定義と、読み込み時の表記揺れの正規化（書式仕様書 4.3・5章）
const Marks = (() => {
  const CIRCLE = '○'; // U+25CB
  const DASH = '−'; // U+2212 マイナス記号
  const BLANK = '';

  // 正規化後の印 → 読み込みで受け付ける文字
  const VARIANTS = {
    [CIRCLE]: ['○', '◯', '〇', 'O', 'o'],
    [DASH]: ['−', '-', '‐', '–', '—', '―', 'ー', 'ｰ', '－'],
  };

  const LOOKUP = new Map();
  for (const [mark, chars] of Object.entries(VARIANTS)) {
    for (const ch of chars) LOOKUP.set(ch, mark);
  }

  // セルの文字を印に変換する。どれにも当てはまらない文字は変換せず known: false を返す
  function normalizeMark(raw) {
    const text = String(raw).trim(); // trim は全角の空白も取り除く
    if (text === '') return { mark: BLANK, known: true };
    if (LOOKUP.has(text)) return { mark: LOOKUP.get(text), known: true };
    return { mark: text, known: false };
  }

  return { CIRCLE, DASH, BLANK, normalizeMark };
})();

if (typeof module !== 'undefined') module.exports = Marks;

// ---- core/markdown.js ----
// Markdownの出力（serialize）と読み込み（parse）。書式は docs/markdown-format.md に従う
//
// マトリクスのデータ：
//   { headers: [階層の列の見出し...], valueHeader: 具体値の列の見出し, testCount: 試験の列の数,
//     rows: [{ levels: [階層の値...], value: 具体値, marks: [印...] }] }
const MarkdownFormat = (() => {
  const marks = typeof module !== 'undefined' ? require('./marks.js') : Marks;

  // ---------- 出力 ----------

  // 試験項番の見出し。3桁のゼロ埋めで、999列を超えたら桁を増やす
  function testNumbers(count) {
    const width = Math.max(3, String(count).length);
    return Array.from({ length: count }, (_, i) => String(i + 1).padStart(width, '0'));
  }

  function escapeCell(text) {
    return String(text).replace(/\r?\n/g, ' ').replace(/\|/g, '\\|');
  }

  function formatRow(cells) {
    return `| ${cells.map(escapeCell).join(' | ')} |`;
  }

  function serialize(matrix) {
    const header = [...matrix.headers, matrix.valueHeader, ...testNumbers(matrix.testCount)];
    const lines = [formatRow(header), formatRow(header.map(() => '---'))];
    for (const row of matrix.rows) {
      lines.push(formatRow([...row.levels, row.value, ...row.marks]));
    }
    return lines.join('\n') + '\n';
  }

  // ---------- 読み込み ----------

  // 行をセルに分ける。\| はセルの区切りではなく文字の | として扱う
  function splitRow(line) {
    let body = line.trim();
    if (body.startsWith('|')) body = body.slice(1);
    if (body.endsWith('|') && !body.endsWith('\\|')) body = body.slice(0, -1);
    const cells = [];
    let current = '';
    for (let i = 0; i < body.length; i++) {
      if (body[i] === '\\' && body[i + 1] === '|') {
        current += '|';
        i++;
      } else if (body[i] === '|') {
        cells.push(current.trim());
        current = '';
      } else {
        current += body[i];
      }
    }
    cells.push(current.trim());
    return cells;
  }

  function isSeparatorRow(cells) {
    return cells.length > 0 && cells.every((c) => /^:?-+:?$/.test(c));
  }

  const isTestHeader = (text) => /^[0-9]+$/.test(text);

  // 「|」で始まる行が続くまとまりを1つの表とみなす。前後の文章やコードブロックの記号は無視される
  function findTables(lines) {
    const tables = [];
    let current = null;
    lines.forEach((line, i) => {
      if (line.trim().startsWith('|')) {
        if (!current) tables.push((current = []));
        current.push({ text: line, lineNo: i + 1 });
      } else {
        current = null;
      }
    });
    return tables;
  }

  function parse(text) {
    const errors = [];
    const warnings = [];
    const fail = (code, message, lines = []) => {
      errors.push({ code, message, lines });
      return { ok: false, matrix: null, errors, warnings };
    };

    const lines = String(text).replace(/^﻿/, '').split(/\r?\n/);
    const tables = findTables(lines);
    if (tables.length === 0) return fail('E1', '表が見つかりません');

    // 試験項番の列を持つ最初の表を採用する。無ければ最初の表
    const hasTestColumn = (t) => splitRow(t[0].text).some(isTestHeader);
    const table = tables.find(hasTestColumn) || tables[0];
    if (tables.length > 1) {
      warnings.push({ code: 'W4', message: `表が${tables.length}個あります。${table[0].lineNo}行目からの表を読み込みました`, cells: [] });
    }

    const header = splitRow(table[0].text);
    if (table.length < 2 || !isSeparatorRow(splitRow(table[1].text))) {
      return fail('E2', '見出し行の次の行が区切り行（| --- | --- |）になっていません', [table[0].lineNo + 1]);
    }

    // 列の境界：最初の数字の見出しから右が試験項番、その直前の1列が具体値
    const firstTest = header.findIndex(isTestHeader);
    const leftCount = firstTest === -1 ? header.length : firstTest;
    if (firstTest !== -1 && !header.slice(firstTest).every(isTestHeader)) {
      return fail('E3', '試験項番（数字の見出し）の列の右に、数字でない見出しの列があります', [table[0].lineNo]);
    }
    if (leftCount < 2) {
      return fail('E4', '試験項番より左の列が2列未満です（階層の列と具体値の列が最低1列ずつ必要です）', [table[0].lineNo]);
    }

    const dataLines = table.slice(2);
    if (dataLines.length === 0) return fail('E6', 'データ行が1行もありません', [table[1].lineNo]);

    const tooLong = dataLines.filter((l) => splitRow(l.text).length > header.length);
    if (tooLong.length > 0) {
      return fail('E5', `見出し行より列が多い行が${tooLong.length}行あります`, tooLong.map((l) => l.lineNo));
    }

    const testCount = header.length - leftCount;
    const shortRows = [];
    const unknownCells = [];
    const rows = dataLines.map((line, r) => {
      const cells = splitRow(line.text);
      if (cells.length < header.length) {
        shortRows.push(r);
        while (cells.length < header.length) cells.push('');
      }
      const rowMarks = cells.slice(leftCount).map((raw, t) => {
        const { mark, known } = marks.normalizeMark(raw);
        if (!known) unknownCells.push({ row: r, col: leftCount + t });
        return mark;
      });
      return { levels: cells.slice(0, leftCount - 1), value: cells[leftCount - 1], marks: rowMarks };
    });

    if (unknownCells.length > 0) {
      warnings.push({ code: 'W1', message: `印の列に、○・−・空欄のどれにも当てはまらない文字が${unknownCells.length}か所あります`, cells: unknownCells });
    }
    if (shortRows.length > 0) {
      warnings.push({ code: 'W2', message: `見出し行より列が少ない行が${shortRows.length}行あります。足りないセルは空欄にしました`, cells: shortRows.map((row) => ({ row, col: null })) });
    }
    const expected = testNumbers(testCount);
    if (header.slice(leftCount).some((h, i) => h !== expected[i])) {
      warnings.push({ code: 'W3', message: '試験項番が 001 からの連番になっていません。左から振り直しました', cells: [] });
    }

    const matrix = {
      headers: header.slice(0, leftCount - 1),
      valueHeader: header[leftCount - 1],
      testCount,
      rows,
    };
    return { ok: true, matrix, errors, warnings };
  }

  return { serialize, parse, testNumbers };
})();

if (typeof module !== 'undefined') module.exports = MarkdownFormat;

// ---- core/matrix.js ----
// マトリクスのデータ操作。どの関数も元のデータを変えず、新しいデータを返す
//
// データの形は markdown.js と同じで、行に画面で行を追うための id が付く：
//   { headers, valueHeader, testCount, rows: [{ id, levels, value, marks }] }
// 試験項番は「左から何番目か」で決まるため、データには持たない
const Matrix = (() => {
  const DEFAULT_HEADERS = ['種類', '対象', '項目', 'パターン'];
  const DEFAULT_VALUE_HEADER = '具体値';
  const DEFAULT_KINDS = ['入力', '機能', '出力'];
  const NEW_LEVEL_HEADER = '新しい階層';

  // ---------- 作成・ID ----------

  // まだ id が無い行に、他の行と重ならない id を付ける
  function withIds(matrix) {
    let next = nextIdNumber(matrix.rows);
    return { ...matrix, rows: matrix.rows.map((row) => (row.id ? row : { ...row, id: `r${next++}` })) };
  }

  function nextIdNumber(rows) {
    const numbers = rows.map((r) => Number(/^r(\d+)$/.exec(r.id || '')?.[1] || 0));
    return Math.max(0, ...numbers) + 1;
  }

  function emptyRow(id, levelCount, testCount) {
    return { id, levels: Array(levelCount).fill(''), value: '', marks: Array(testCount).fill('') };
  }

  // 新しく作るときの初期状態。「種類」の初期分類を1行ずつ用意する
  function createDefault() {
    return {
      headers: [...DEFAULT_HEADERS],
      valueHeader: DEFAULT_VALUE_HEADER,
      testCount: 0,
      rows: DEFAULT_KINDS.map((kind, i) => {
        const row = emptyRow(`r${i + 1}`, DEFAULT_HEADERS.length, 0);
        row.levels[0] = kind;
        return row;
      }),
    };
  }

  // ブラウザに保存しておいたデータが、マトリクスとして正しい形かを確かめる
  function isValid(m) {
    const isText = (v) => typeof v === 'string';
    const isTextList = (v) => Array.isArray(v) && v.every(isText);
    return (
      !!m &&
      isTextList(m.headers) && m.headers.length >= 1 &&
      isText(m.valueHeader) &&
      Number.isInteger(m.testCount) && m.testCount >= 0 &&
      Array.isArray(m.rows) &&
      m.rows.every((row) =>
        !!row && isText(row.id) && isText(row.value) &&
        isTextList(row.levels) && row.levels.length === m.headers.length &&
        isTextList(row.marks) && row.marks.length === m.testCount)
    );
  }

  // ---------- 行 ----------

  // index の位置に行を挿入する。上の行から、階層の最下段の1つ手前までの値を引き継ぐ
  function insertRow(matrix, index) {
    const row = emptyRow(`r${nextIdNumber(matrix.rows)}`, matrix.headers.length, matrix.testCount);
    const above = matrix.rows[index - 1];
    if (above) {
      for (let i = 0; i < matrix.headers.length - 1; i++) row.levels[i] = above.levels[i];
    }
    const rows = [...matrix.rows];
    rows.splice(index, 0, row);
    return { ...matrix, rows };
  }

  function deleteRow(matrix, index) {
    return { ...matrix, rows: matrix.rows.filter((_, i) => i !== index) };
  }

  // ---------- 試験の列 ----------

  function mapMarks(matrix, testCount, fn) {
    return { ...matrix, testCount, rows: matrix.rows.map((row) => ({ ...row, marks: fn([...row.marks]) })) };
  }

  // index の位置（0 なら先頭）に空の試験の列を挿入する
  function insertTest(matrix, index) {
    return mapMarks(matrix, matrix.testCount + 1, (marks) => {
      marks.splice(index, 0, '');
      return marks;
    });
  }

  // index の試験の列を複製し、すぐ右に挿入する
  function duplicateTest(matrix, index) {
    return mapMarks(matrix, matrix.testCount + 1, (marks) => {
      marks.splice(index + 1, 0, marks[index]);
      return marks;
    });
  }

  function deleteTest(matrix, index) {
    return mapMarks(matrix, matrix.testCount - 1, (marks) => marks.filter((_, i) => i !== index));
  }

  // ---------- 階層の列・見出し ----------

  // 階層の列の右端（具体値の列の左）に列を追加する
  function addLevel(matrix) {
    return {
      ...matrix,
      headers: [...matrix.headers, NEW_LEVEL_HEADER],
      rows: matrix.rows.map((row) => ({ ...row, levels: [...row.levels, ''] })),
    };
  }

  // 階層の列を削除する。階層の列は最低1列残す
  function deleteLevel(matrix, index) {
    if (matrix.headers.length <= 1) return matrix;
    return {
      ...matrix,
      headers: matrix.headers.filter((_, i) => i !== index),
      rows: matrix.rows.map((row) => ({ ...row, levels: row.levels.filter((_, i) => i !== index) })),
    };
  }

  function renameLevel(matrix, index, name) {
    return { ...matrix, headers: matrix.headers.map((h, i) => (i === index ? name : h)) };
  }

  function renameValueHeader(matrix, name) {
    return { ...matrix, valueHeader: name };
  }

  // ---------- セル ----------

  function updateRow(matrix, rowIndex, fn) {
    return { ...matrix, rows: matrix.rows.map((row, i) => (i === rowIndex ? fn(row) : row)) };
  }

  function setLevel(matrix, rowIndex, levelIndex, text) {
    return updateRow(matrix, rowIndex, (row) => ({ ...row, levels: row.levels.map((v, i) => (i === levelIndex ? text : v)) }));
  }

  // 結合して表示しているセルの編集。結合している行（start から count 行）をまとめて書き換える
  function setLevelRange(matrix, start, count, levelIndex, text) {
    let next = matrix;
    for (let r = start; r < start + count; r++) next = setLevel(next, r, levelIndex, text);
    return next;
  }

  function setValue(matrix, rowIndex, text) {
    return updateRow(matrix, rowIndex, (row) => ({ ...row, value: text }));
  }

  function setMark(matrix, rowIndex, testIndex, mark) {
    return updateRow(matrix, rowIndex, (row) => ({ ...row, marks: row.marks.map((m, i) => (i === testIndex ? mark : m)) }));
  }

  return {
    createDefault, withIds, isValid,
    insertRow, deleteRow,
    insertTest, duplicateTest, deleteTest,
    addLevel, deleteLevel, renameLevel, renameValueHeader,
    setLevel, setLevelRange, setValue, setMark,
  };
})();

if (typeof module !== 'undefined') module.exports = Matrix;

// ---- core/checks.js ----
// 改変チェック（書式仕様書 7章）、網羅チェック、セル結合の範囲の計算（書式仕様書 8章）
const Checks = (() => {
  const marks = typeof module !== 'undefined' ? require('./marks.js') : Marks;

  // ---------- 改変チェック ----------

  const rowKey = (row) => JSON.stringify([...row.levels, row.value]);

  // 2つの並びで、順番を保ったまま一致する組を最も多く取る（最長共通部分列）
  function matchInOrder(a, b) {
    const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
    for (let i = a.length - 1; i >= 0; i--) {
      for (let j = b.length - 1; j >= 0; j--) {
        dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    const pairs = [];
    let i = 0;
    let j = 0;
    while (i < a.length && j < b.length) {
      if (a[i] === b[j]) pairs.push([i++, j++]);
      else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
      else j++;
    }
    return pairs;
  }

  // 「種類」だけが入った初期状態の行は、条件を入力したことにならない
  const hasCondition = (row) => row.levels.slice(1).some((v) => v !== '') || row.value !== '';

  // 読み込む直前の画面（current）と、読み込んだ表（imported）の左側の条件を比べる。
  // 差分が無ければ null、あれば W5、比較元に条件が無ければ W6 を返す
  function compareLeft(current, imported) {
    if (!current.rows.some(hasCondition)) {
      return { code: 'W6', message: '画面に条件が無いため、改変チェックを省略しました', cells: [] };
    }

    const headerChanged =
      current.valueHeader !== imported.valueHeader ||
      current.headers.length !== imported.headers.length ||
      current.headers.some((h, i) => h !== imported.headers[i]);

    const a = current.rows.map(rowKey);
    const b = imported.rows.map(rowKey);
    const added = [];
    const changed = [];
    let deleted = 0;
    // 一致した行と行の間に残った行は、上から順に「書き換え」として対応付け、余りを追加・削除とする
    const pairs = [...matchInOrder(a, b), [a.length, b.length]];
    let prevA = 0;
    let prevB = 0;
    for (const [ia, ib] of pairs) {
      const restA = ia - prevA;
      const restB = ib - prevB;
      for (let k = 0; k < restB; k++) (k < restA ? changed : added).push(prevB + k);
      deleted += Math.max(0, restA - restB);
      prevA = ia + 1;
      prevB = ib + 1;
    }

    if (!headerChanged && added.length === 0 && changed.length === 0 && deleted === 0) return null;

    const parts = [];
    if (headerChanged) parts.push('見出しの変更');
    if (added.length) parts.push(`追加${added.length}行`);
    if (changed.length) parts.push(`書き換え${changed.length}行`);
    if (deleted) parts.push(`削除${deleted}行`);
    return {
      code: 'W5',
      message: `左側の条件が、読み込む前から変わっています（${parts.join('、')}）`,
      cells: [...changed, ...added].sort((x, y) => x - y).map((row) => ({ row, col: null })),
      details: { headerChanged, added, changed, deleted },
    };
  }

  // ---------- 網羅チェック ----------

  // 「種類」が出力（結果）の行。期待値は参考資料が無いと空欄で返るため、網羅チェックの対象から外す
  const isOutputRow = (row) => row.levels[0].startsWith('出力');

  // ○ が1つも無い行と、○ が1つも無い試験の列の番号（0始まり）を返す。出力の行は数えない
  function coverage(matrix) {
    if (matrix.testCount === 0) return { rows: [], tests: [] }; // 試験がまだ無いうちは調べない
    const has = (m) => m === marks.CIRCLE;
    const targets = matrix.rows.filter((row) => !isOutputRow(row));
    const rows = [];
    matrix.rows.forEach((row, r) => {
      if (!isOutputRow(row) && !row.marks.some(has)) rows.push(r);
    });
    const tests = [];
    for (let t = 0; t < matrix.testCount; t++) {
      if (!targets.some((row) => has(row.marks[t]))) tests.push(t);
    }
    return { rows, tests };
  }

  // ---------- セル結合 ----------

  // 階層の列ごとに、各行のセルの縦の結合数を返す。spans[列][行]
  //   1以上：その行から始まるセルが何行分を占めるか
  //   0    ：上のセルに結合されて表示しない
  // 同じ値が上下に続き、かつ親の列でも同じセルに結合されているときだけ結合する。空欄は結合しない
  function mergeSpans(matrix) {
    const spans = [];
    let parentGroup = matrix.rows.map(() => 0); // 親の列での「結合のまとまり」の番号
    matrix.headers.forEach((_, c) => {
      const group = [];
      const span = [];
      let start = -1;
      matrix.rows.forEach((row, r) => {
        const value = row.levels[c];
        const joins = r > 0 && value !== '' && value === matrix.rows[r - 1].levels[c] && parentGroup[r] === parentGroup[r - 1];
        if (joins) {
          group.push(group[r - 1]);
          span.push(0);
          span[start]++;
        } else {
          group.push(r);
          span.push(1);
          start = r;
        }
      });
      spans.push(span);
      parentGroup = group;
    });
    return spans;
  }

  return { compareLeft, coverage, mergeSpans };
})();

if (typeof module !== 'undefined') module.exports = Checks;

// ---- core/history.js ----
// 元に戻す・やり直し。操作のたびに「操作後のデータ」を積み重ねる
//
// データは操作のたびに新しく作られる（matrix.js）ため、前の状態をそのまま取っておける。
// 変わっていない行は前の状態と共有されるので、履歴を持ってもメモリはあまり増えない
const History = (() => {
  const DEFAULT_LIMIT = 100;

  function create(present, limit = DEFAULT_LIMIT) {
    return { past: [], present, future: [], limit };
  }

  // 新しい操作を記録する。やり直しの履歴は消える。読み込みも1回の操作として記録する
  function push(history, next) {
    if (next === history.present) return history;
    const past = [...history.past, history.present].slice(-history.limit);
    return { ...history, past, present: next, future: [] };
  }

  function undo(history) {
    if (!canUndo(history)) return history;
    return {
      ...history,
      past: history.past.slice(0, -1),
      present: history.past[history.past.length - 1],
      future: [history.present, ...history.future],
    };
  }

  function redo(history) {
    if (!canRedo(history)) return history;
    return {
      ...history,
      past: [...history.past, history.present],
      present: history.future[0],
      future: history.future.slice(1),
    };
  }

  const canUndo = (history) => history.past.length > 0;
  const canRedo = (history) => history.future.length > 0;

  return { create, push, undo, redo, canUndo, canRedo };
})();

if (typeof module !== 'undefined') module.exports = History;

// ---- core/prompt.js ----
// AIへの指示文（要件定義書 5.7）。指示文の本文は docs/ai-prompt.md から、ビルド時に埋め込む
const Prompt = (() => {
  const format = typeof module !== 'undefined' ? require('./markdown.js') : MarkdownFormat;
  const PLACEHOLDER = '{{MATRIX}}';

  // 指示文の {{MATRIX}} を、左側の条件だけの表（試験の列は0列）に置き換える。
  // AIが試験の列を作るため、画面に試験の列があっても渡さない
  function build(template, matrix) {
    const conditions = { ...matrix, testCount: 0, rows: matrix.rows.map((row) => ({ ...row, marks: [] })) };
    return template.replace(PLACEHOLDER, () => format.serialize(conditions).trimEnd());
  }

  // docs/ai-prompt.md の「````text」で囲まれた部分を指示文として取り出す
  function extract(markdown) {
    const match = markdown.match(/^````text\r?\n([\s\S]*?)\r?\n````$/m);
    if (!match) throw new Error('ai-prompt.md に ````text で囲まれた指示文がありません');
    if (!match[1].includes(PLACEHOLDER)) throw new Error(`指示文に ${PLACEHOLDER} がありません`);
    return match[1];
  }

  return { build, extract, PLACEHOLDER };
})();

if (typeof module !== 'undefined') module.exports = Prompt;

// ---- ui/table.js ----
// 表の描画。マトリクスのデータから表のHTMLを作る（書式仕様書 8章、要件定義書 5.10）
//
// HTMLを作る buildHtml は画面に依存しないので、Node.js でもテストできる
const TableView = (() => {
  const checks = typeof module !== 'undefined' ? require('../core/checks.js') : Checks;
  const format = typeof module !== 'undefined' ? require('../core/markdown.js') : MarkdownFormat;

  // 左側の列は幅を固定する。固定表示の位置（left）は、描画後に実際の位置を測って設定する
  const LEVEL_WIDTH = 120;
  const VALUE_WIDTH = 110;

  const escape = (text) =>
    String(text).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);

  // 表の列番号（col）：階層の列 0〜L-1、具体値の列 L、試験の列 L+1〜（書式仕様書の警告のセル位置と同じ）
  //
  // highlights（どれも省略可）：
  //   warnCells       … 色を付けるセル。"行:列" の Set（W1 など）
  //   warnRows        … 左側の条件に色を付ける行の Set（W2・W5 など）
  //   uncoveredRows   … ○ が1つも無い行の Set（網羅チェック）
  //   uncoveredTests  … ○ が1つも無い試験の列の Set（網羅チェック）
  function buildHtml(matrix, highlights = {}) {
    const { warnCells = new Set(), warnRows = new Set(), uncoveredRows = new Set(), uncoveredTests = new Set() } = highlights;
    const levelCount = matrix.headers.length;
    const testCount = matrix.testCount;
    const spans = checks.mergeSpans(matrix);
    const numbers = format.testNumbers(testCount);
    const leftStyle = (c, width) => `style="min-width:${width}px;max-width:${width}px"`;

    const out = [];
    out.push('<table class="matrix"><thead><tr class="head-1">');
    matrix.headers.forEach((h, c) => {
      // 階層の列の右端の見出しに、階層の列を追加する＋を付ける
      const isLast = c === levelCount - 1;
      const addLevel = isLast ? '<button type="button" class="add-level" title="階層の列を追加">+</button>' : '';
      out.push(`<th class="left level${isLast ? ' last-level' : ''}" rowspan="2" data-col="${c}" ${leftStyle(c, LEVEL_WIDTH)}><span class="text">${escape(h)}</span>${addLevel}</th>`);
    });
    out.push(`<th class="left value" rowspan="2" data-col="${levelCount}" ${leftStyle(levelCount, VALUE_WIDTH)}>${escape(matrix.valueHeader)}</th>`);
    out.push(`<th class="test-group" colspan="${Math.max(testCount, 1)}">試験項番</th>`);
    out.push('<th class="add-test" rowspan="2" title="試験の列を右端に追加">+</th>');
    out.push('</tr><tr class="head-2">');
    if (testCount === 0) out.push('<th class="test-no empty">なし</th>');
    numbers.forEach((no, t) => {
      const cls = uncoveredTests.has(t) ? ' uncovered' : '';
      out.push(`<th class="test-no${cls}" data-test="${t}">${no}</th>`);
    });
    out.push('</tr></thead><tbody>');

    matrix.rows.forEach((row, r) => {
      const rowCls = [warnRows.has(r) && 'warn-row', uncoveredRows.has(r) && 'uncovered'].filter(Boolean).join(' ');
      out.push(`<tr data-row="${r}"${rowCls ? ` class="${rowCls}"` : ''}>`);
      row.levels.forEach((text, c) => {
        if (spans[c][r] === 0) return; // 上のセルに結合されている
        const span = spans[c][r] > 1 ? ` rowspan="${spans[c][r]}"` : '';
        const warn = warnCells.has(`${r}:${c}`) ? ' warn' : '';
        out.push(`<td class="left level${warn}"${span} data-col="${c}" ${leftStyle(c, LEVEL_WIDTH)}>${escape(text)}</td>`);
      });
      const valueWarn = warnCells.has(`${r}:${levelCount}`) ? ' warn' : '';
      out.push(`<td class="left value${valueWarn}" data-col="${levelCount}" ${leftStyle(levelCount, VALUE_WIDTH)}>${escape(row.value)}</td>`);
      if (testCount === 0) out.push('<td class="mark empty"></td>');
      row.marks.forEach((mark, t) => {
        const warn = warnCells.has(`${r}:${levelCount + 1 + t}`) ? ' warn' : '';
        out.push(`<td class="mark${warn}" data-test="${t}">${escape(mark)}</td>`);
      });
      out.push('</tr>');
    });

    out.push('</tbody></table>');
    return out.join('');
  }

  // 書式仕様書の警告（cells の row・col）を、buildHtml の highlights に変換する
  function highlightsFromWarnings(warnings) {
    const warnCells = new Set();
    const warnRows = new Set();
    for (const w of warnings) {
      for (const { row, col } of w.cells || []) {
        if (col === null) warnRows.add(row);
        else warnCells.add(`${row}:${col}`);
      }
    }
    return { warnCells, warnRows };
  }

  function render(container, matrix, highlights) {
    container.innerHTML = buildHtml(matrix, highlights);
    const table = container.querySelector('table');
    // 左側の列：見出しのセルの位置を測り、同じ列のセルをその位置で固定する
    const lefts = {};
    table.querySelectorAll('thead th.left').forEach((th) => {
      lefts[th.dataset.col] = th.offsetLeft;
    });
    table.querySelectorAll('.left').forEach((cell) => {
      cell.style.left = `${lefts[cell.dataset.col]}px`;
    });
    // 見出しの2行目：1行目の高さの分だけ下で固定する
    const firstRowHeight = table.querySelector('tr.head-1').offsetHeight;
    table.querySelectorAll('tr.head-2 th').forEach((th) => {
      th.style.top = `${firstRowHeight}px`;
    });
  }

  return { buildHtml, highlightsFromWarnings, render, LEVEL_WIDTH, VALUE_WIDTH };
})();

if (typeof module !== 'undefined') module.exports = TableView;

// ---- ui/editing.js ----
// 表の編集操作（要件定義書 5.10）
//   - セルや見出しをクリックすると、その場で編集する
//   - 印のセルをクリックすると、そのセルにだけプルダウン（○ / − / 空欄）を出す
//   - 行・列の間にマウスを乗せると、破線と＋を出して挿入できる
//   - 右クリックで「挿入・複製・削除」のメニューを出す
//   - Ctrl+Z で元に戻し、Ctrl+Y（Ctrl+Shift+Z）でやり直す
//
// データの変更はすべて update(関数) を通して行い、app.js が履歴に積んで描き直す
const Editing = (() => {
  const EDGE = 6; // 行・列の境目とみなす範囲（px）

  const MARK_OPTIONS = [
    { mark: Marks.CIRCLE, label: '○ 確認する' },
    { mark: Marks.DASH, label: '− 到達しない' },
    { mark: Marks.BLANK, label: '空欄 該当なし' },
  ];

  function attach({ container, getMatrix, update, undo, redo, refresh }) {
    let editing = false;
    let insertAt = null; // { kind: 'row' | 'test', index }

    // ---------- 画面の上に重ねる部品 ----------

    const line = element('div', 'insert-line');
    const plus = element('button', 'insert-plus', '+');
    const popup = element('div', 'popup');
    plus.type = 'button';
    document.body.append(line, plus, popup);

    function element(tag, className, text = '') {
      const el = document.createElement(tag);
      el.className = className;
      el.textContent = text;
      el.hidden = true;
      return el;
    }

    function hideInsert() {
      line.hidden = true;
      plus.hidden = true;
      insertAt = null;
    }

    function hidePopup() {
      popup.hidden = true;
      container.querySelectorAll('.selected').forEach((el) => el.classList.remove('selected'));
    }

    // items：[{ label, action, disabled }] または '-'（区切り線）
    function showPopup(items, x, y) {
      popup.innerHTML = '';
      for (const item of items) {
        if (item === '-') {
          popup.append(Object.assign(document.createElement('hr')));
          continue;
        }
        const button = Object.assign(document.createElement('button'), { type: 'button', textContent: item.label, disabled: !!item.disabled });
        button.addEventListener('click', () => {
          hidePopup();
          item.action();
        });
        popup.append(button);
      }
      popup.hidden = false;
      // 画面の外にはみ出さないように位置を調整する
      const { width, height } = popup.getBoundingClientRect();
      popup.style.left = `${Math.min(x, window.innerWidth - width - 8)}px`;
      popup.style.top = `${Math.min(y, window.innerHeight - height - 8)}px`;
    }

    // ---------- 行・列の間の挿入 ----------

    function onMouseMove(e) {
      if (editing || !popup.hidden) return;
      const cell = e.target.closest('td, th.test-no');
      if (!cell || !container.contains(cell)) return hideInsert();
      const rect = cell.getBoundingClientRect();
      const box = visibleBox();

      // 行の境目（td の上端・下端）
      if (cell.tagName === 'TD') {
        const row = Number(cell.closest('tr').dataset.row);
        const nearTop = e.clientY - rect.top < EDGE;
        const nearBottom = rect.bottom - e.clientY < EDGE;
        if (nearTop || nearBottom) {
          const index = nearTop ? row : row + cell.rowSpan;
          const y = nearTop ? rect.top : rect.bottom;
          return showInsert({ kind: 'row', index }, box.left, y - 1, box.right - box.left, 2, box.right - 14, y);
        }
      }
      // 試験の列の境目（印のセル・項番の見出しの左端・右端）
      if (cell.dataset.test !== undefined) {
        const test = Number(cell.dataset.test);
        const nearLeft = e.clientX - rect.left < EDGE;
        const nearRight = rect.right - e.clientX < EDGE;
        if (nearLeft || nearRight) {
          const x = nearLeft ? rect.left : rect.right;
          return showInsert({ kind: 'test', index: nearLeft ? test : test + 1 }, x - 1, box.top, 2, box.bottom - box.top, x, box.top + 14);
        }
      }
      hideInsert();
    }

    // 表のうち、いま画面に見えている範囲
    function visibleBox() {
      const c = container.getBoundingClientRect();
      const t = container.querySelector('table').getBoundingClientRect();
      return { left: c.left, right: Math.min(c.right, t.right), top: t.top < c.top ? c.top : t.top, bottom: Math.min(c.bottom, t.bottom) };
    }

    function showInsert(target, lineX, lineY, lineW, lineH, plusX, plusY) {
      insertAt = target;
      Object.assign(line.style, { left: `${lineX}px`, top: `${lineY}px`, width: `${lineW}px`, height: `${lineH}px` });
      line.classList.toggle('vertical', target.kind === 'test');
      Object.assign(plus.style, { left: `${plusX}px`, top: `${plusY}px` });
      plus.title = target.kind === 'row' ? 'ここに行を挿入' : 'ここに試験の列を挿入';
      line.hidden = false;
      plus.hidden = false;
    }

    plus.addEventListener('click', () => {
      const target = insertAt;
      hideInsert();
      if (target?.kind === 'row') update((m) => Matrix.insertRow(m, target.index));
      if (target?.kind === 'test') update((m) => Matrix.insertTest(m, target.index));
    });

    // ＋ボタンに移るときは、表から出ても＋を消さない
    container.addEventListener('mouseleave', (e) => {
      if (e.relatedTarget !== plus) hideInsert();
    });
    plus.addEventListener('mouseleave', (e) => {
      if (!container.contains(e.relatedTarget)) hideInsert();
    });

    // ---------- クリック ----------

    function onClick(e) {
      if (editing) return;
      const target = e.target;
      if (target.closest('.add-level')) return update((m) => Matrix.addLevel(m));
      if (target.closest('.add-test')) return update((m) => Matrix.insertTest(m, m.testCount));
      if (target.closest('th.test-no.empty')) return update((m) => Matrix.insertTest(m, 0));

      const mark = target.closest('td.mark[data-test]');
      if (mark) return openMarkMenu(mark);

      const left = target.closest('.left');
      if (left) startEdit(left);
    }

    function openMarkMenu(cell) {
      hideInsert();
      hidePopup();
      const row = Number(cell.closest('tr').dataset.row);
      const test = Number(cell.dataset.test);
      cell.classList.add('selected');
      const rect = cell.getBoundingClientRect();
      showPopup(
        MARK_OPTIONS.map(({ mark, label }) => ({ label, action: () => update((m) => Matrix.setMark(m, row, test, mark)) })),
        rect.left,
        rect.bottom + 2,
      );
    }

    // ---------- その場での編集 ----------

    // セルが表すデータ（どの値を、どう書き換えるか）
    function editTarget(cell) {
      const m = getMatrix();
      const col = Number(cell.dataset.col);
      const isValue = col === m.headers.length;
      if (cell.tagName === 'TH') {
        return isValue
          ? { text: m.valueHeader, apply: (t) => (x) => Matrix.renameValueHeader(x, t) }
          : { text: m.headers[col], apply: (t) => (x) => Matrix.renameLevel(x, col, t) };
      }
      const row = Number(cell.closest('tr').dataset.row);
      return isValue
        ? { text: m.rows[row].value, apply: (t) => (x) => Matrix.setValue(x, row, t) }
        : { text: m.rows[row].levels[col], apply: (t) => (x) => Matrix.setLevelRange(x, row, cell.rowSpan, col, t) };
    }

    function startEdit(cell) {
      hideInsert();
      hidePopup();
      const target = editTarget(cell);
      const input = Object.assign(document.createElement('input'), { type: 'text', value: target.text, className: 'cell-input' });
      cell.replaceChildren(input);
      editing = true;
      input.focus();
      input.select();

      let done = false;
      const finish = (save) => {
        if (done) return;
        done = true;
        editing = false;
        // セル内の改行は使えない（書式仕様書 4.4）
        const text = input.value.replace(/[\r\n]+/g, ' ').trim();
        if (save && text !== target.text) update(target.apply(text));
        else refresh();
      };
      input.addEventListener('keydown', (e) => {
        if (e.isComposing) return; // 日本語の変換を確定する Enter は無視する
        if (e.key === 'Enter') finish(true);
        if (e.key === 'Escape') finish(false);
      });
      input.addEventListener('blur', () => finish(true));
    }

    // ---------- 右クリックメニュー ----------

    function onContextMenu(e) {
      if (editing) return;
      const cell = e.target.closest('td, th');
      if (!cell || !container.contains(cell)) return;
      const items = menuItems(cell);
      if (!items) return;
      e.preventDefault();
      hideInsert();
      hidePopup();
      cell.classList.add('selected');
      showPopup(items, e.clientX, e.clientY);
    }

    function menuItems(cell) {
      const m = getMatrix();
      if (cell.dataset.test !== undefined) {
        const t = Number(cell.dataset.test);
        return [
          { label: '左に試験の列を挿入', action: () => update((x) => Matrix.insertTest(x, t)) },
          { label: '右に試験の列を挿入', action: () => update((x) => Matrix.insertTest(x, t + 1)) },
          { label: 'この試験の列を複製', action: () => update((x) => Matrix.duplicateTest(x, t)) },
          '-',
          { label: 'この試験の列を削除', action: () => update((x) => Matrix.deleteTest(x, t)) },
        ];
      }
      if (cell.tagName === 'TH' && cell.classList.contains('level')) {
        const c = Number(cell.dataset.col);
        return [
          { label: '階層の列を右端に追加', action: () => update((x) => Matrix.addLevel(x)) },
          '-',
          { label: 'この階層の列を削除', disabled: m.headers.length <= 1, action: () => update((x) => Matrix.deleteLevel(x, c)) },
        ];
      }
      if (cell.tagName === 'TD' && cell.classList.contains('left')) {
        const r = Number(cell.closest('tr').dataset.row);
        return [
          { label: '上に行を挿入', action: () => update((x) => Matrix.insertRow(x, r)) },
          { label: '下に行を挿入', action: () => update((x) => Matrix.insertRow(x, r + 1)) },
          '-',
          { label: 'この行を削除', action: () => update((x) => Matrix.deleteRow(x, r)) },
        ];
      }
      return null;
    }

    // ---------- キーボード ----------

    function onKeyDown(e) {
      if (e.key === 'Escape') {
        hidePopup();
        hideInsert();
        return;
      }
      if (editing || e.target.closest?.('input, textarea')) return; // 入力欄の中では、入力欄の元に戻すを使う
      const ctrl = e.ctrlKey || e.metaKey;
      if (!ctrl) return;
      const key = e.key.toLowerCase();
      if (key === 'z' && !e.shiftKey) {
        e.preventDefault();
        undo();
      } else if (key === 'y' || (key === 'z' && e.shiftKey)) {
        e.preventDefault();
        redo();
      }
    }

    container.addEventListener('mousemove', onMouseMove);
    container.addEventListener('click', onClick);
    container.addEventListener('contextmenu', onContextMenu);
    container.addEventListener('scroll', () => {
      hideInsert();
      hidePopup();
    });
    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('mousedown', (e) => {
      if (!popup.hidden && !popup.contains(e.target)) hidePopup();
    });

    // 描き直したときは、表の上に出していた部品を消す
    return {
      reset() {
        hideInsert();
        hidePopup();
      },
    };
  }

  return { attach };
})();

// ---- ui/dialogs.js ----
// ダイアログ（ポップアップ）と、画面下に短く出すお知らせ
const Dialogs = (() => {
  // buttons：[{ label, primary, action(close) }]。action が false を返したときは閉じない
  function open({ title, body, buttons, wide = false }) {
    const dialog = document.createElement('dialog');
    dialog.className = `dialog${wide ? ' wide' : ''}`;

    const heading = Object.assign(document.createElement('h2'), { textContent: title });
    const content = document.createElement('div');
    content.className = 'dialog-body';
    content.append(...[].concat(body));

    const footer = document.createElement('div');
    footer.className = 'dialog-buttons';
    const close = () => {
      dialog.close();
      dialog.remove();
    };
    for (const { label, primary, action } of buttons) {
      const button = Object.assign(document.createElement('button'), { type: 'button', textContent: label });
      if (primary) button.className = 'primary';
      button.addEventListener('click', async () => {
        if ((await action?.()) !== false) close();
      });
      footer.append(button);
    }

    dialog.append(heading, content, footer);
    dialog.addEventListener('cancel', close); // Esc キー
    document.body.append(dialog);
    dialog.showModal();
    return { dialog, close };
  }

  // 見出しと箇条書きだけのダイアログ。kind は 'error' | 'warning' | 'info'
  function message(title, lead, items = [], kind = 'info') {
    const body = [Object.assign(document.createElement('p'), { textContent: lead })];
    if (items.length) {
      const list = document.createElement('ul');
      for (const item of items) list.append(Object.assign(document.createElement('li'), { textContent: item }));
      body.push(list);
    }
    const { dialog } = open({ title, body, buttons: [{ label: '閉じる', primary: true }] });
    dialog.classList.add(kind);
  }

  let toastTimer = null;
  function toast(text) {
    let el = document.querySelector('.toast');
    if (!el) {
      el = Object.assign(document.createElement('div'), { className: 'toast' });
      document.body.append(el);
    }
    el.textContent = text;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      el.hidden = true;
    }, 2500);
  }

  return { open, message, toast };
})();

// ---- ui/storage.js ----
// ブラウザ内への一時保存（要件定義書 5.5）
//
// file:// で開いたページは、同じPCのほかの file:// のページと保存領域を共有するため、
// このツール専用の名前（KEY）で保存する。キャッシュを消すと消えるので、バックアップはMarkdownの出力で行う
const AutoSave = (() => {
  const KEY = 'test-matrix-editor/matrix';
  const VERSION = 1;

  function available() {
    try {
      const probe = `${KEY}/probe`;
      localStorage.setItem(probe, '1');
      localStorage.removeItem(probe);
      return true;
    } catch (e) {
      return false;
    }
  }

  // 保存できたら true。容量不足などで保存できなければ false
  function save(matrix) {
    try {
      localStorage.setItem(KEY, JSON.stringify({ version: VERSION, savedAt: new Date().toISOString(), matrix }));
      return true;
    } catch (e) {
      return false;
    }
  }

  // 保存されたデータが無い・壊れている場合は null
  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY));
      return data?.version === VERSION && Matrix.isValid(data.matrix) ? data.matrix : null;
    } catch (e) {
      return null;
    }
  }

  return { available, save, load };
})();

// ---- ui/toolbar.js ----
// ツールバーの「Markdown出力」「読み込み」「指示文コピー」（要件定義書 5.4・5.7・5.9）
const Toolbar = (() => {
  function attach({ getMatrix, importMarkdown }) {
    const on = (action, handler) => document.querySelector(`[data-action="${action}"]`).addEventListener('click', handler);
    on('export', () => openExport(getMatrix()));
    on('import', () => openImport(importMarkdown));
    on('copy-prompt', () => copyPrompt(getMatrix()));
  }

  // ---------- Markdown出力 ----------

  function openExport(matrix) {
    const text = MarkdownFormat.serialize(matrix);
    const area = Object.assign(document.createElement('textarea'), { value: text, readOnly: true, className: 'markdown-area' });
    Dialogs.open({
      title: 'Markdown出力',
      wide: true,
      body: [area],
      buttons: [
        { label: '閉じる' },
        { label: '.md ファイルとして保存', action: () => saveFile(text) },
        { label: 'コピー', primary: true, action: () => copyAndNotify(text, 'Markdownをコピーしました') },
      ],
    });
  }

  function saveFile(text) {
    const pad = (n) => String(n).padStart(2, '0');
    const d = new Date();
    const name = `test-matrix-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.md`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/markdown' }));
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    Dialogs.toast(`${name} を保存しました`);
  }

  // ---------- 読み込み ----------

  function openImport(importMarkdown) {
    const area = Object.assign(document.createElement('textarea'), {
      className: 'markdown-area',
      placeholder: 'AIが返したMarkdownを、説明文ごと貼り付けてください。',
    });
    const file = Object.assign(document.createElement('input'), { type: 'file', accept: '.md,.txt,text/markdown,text/plain' });
    file.addEventListener('change', async () => {
      if (file.files[0]) area.value = await file.files[0].text();
    });
    const fileRow = document.createElement('label');
    fileRow.className = 'file-row';
    fileRow.append('ファイルから読み込む：', file);

    Dialogs.open({
      title: '読み込み',
      wide: true,
      body: [fileRow, area],
      buttons: [
        { label: 'キャンセル' },
        { label: '読み込む', primary: true, action: () => submit() },
      ],
    });
    area.focus();

    function submit() {
      if (!area.value.trim()) return false;
      const result = importMarkdown(area.value);
      if (!result.ok) {
        showErrors(result.errors);
        return false; // 直して読み込み直せるよう、読み込みのダイアログは閉じない
      }
      if (result.warnings.length) showWarnings(result.warnings);
      else Dialogs.toast('読み込みました');
      return true;
    }
  }

  function showErrors(errors) {
    const items = errors.map((e) => `${e.code}：${e.message}${e.lines.length ? `（${e.lines.join('・')}行目）` : ''}`);
    Dialogs.message('読み込めませんでした', '表の形が崩れているため、読み込みを中止しました。', items, 'error');
  }

  function showWarnings(warnings) {
    const items = warnings.map((w) => `${w.code}：${w.message}`);
    const lead = `読み込みましたが、確認が必要な点が${warnings.length}件あります。色の付いたセルを確認してください。`;
    Dialogs.message('読み込みました（警告あり）', lead, items, 'warning');
  }

  // ---------- 指示文コピー ----------

  function copyPrompt(matrix) {
    copyAndNotify(Prompt.build(PROMPT_TEMPLATE, matrix), 'AIへの指示文と条件の表をコピーしました');
  }

  // ---------- クリップボード ----------

  async function copyAndNotify(text, done) {
    if (await copyText(text)) {
      Dialogs.toast(done);
      return;
    }
    // コピーできない環境では、表示して手でコピーしてもらう
    const area = Object.assign(document.createElement('textarea'), { value: text, readOnly: true, className: 'markdown-area' });
    Dialogs.open({ title: 'コピーできませんでした', wide: true, body: [area], buttons: [{ label: '閉じる', primary: true }] });
    area.select();
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      // 古い方法で試す
      const area = Object.assign(document.createElement('textarea'), { value: text });
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.append(area);
      area.select();
      let ok = false;
      try {
        ok = document.execCommand('copy');
      } catch (_) {
        ok = false;
      }
      area.remove();
      return ok;
    }
  }

  return { attach };
})();

// ---- app.js ----
// 画面の起動処理。各モジュールを組み合わせて画面を動かす
const App = (() => {
  const container = document.getElementById('app');
  const status = document.getElementById('status');
  const buttons = {
    undo: document.querySelector('[data-action="undo"]'),
    redo: document.querySelector('[data-action="redo"]'),
  };

  // 履歴には、データと「そのデータを読み込んだときの警告」を組にして積む。
  // 読み込んだ直後の状態に戻したときは、警告の強調表示も元に戻る。
  // 起動時は、ブラウザに保存しておいたデータがあればそれを使う
  const saved = AutoSave.load();
  let history = History.create({ matrix: saved || Matrix.createDefault(), warnings: [] });
  let savedAt = saved ? new Date() : null;

  const editing = Editing.attach({
    container,
    getMatrix: () => history.present.matrix,
    update,
    undo,
    redo,
    refresh: render,
  });

  Toolbar.attach({ getMatrix: () => history.present.matrix, importMarkdown });

  function render() {
    const { matrix, warnings } = history.present;
    const coverage = Checks.coverage(matrix);
    editing.reset();
    TableView.render(container, matrix, {
      ...TableView.highlightsFromWarnings(warnings),
      uncoveredRows: new Set(coverage.rows),
      uncoveredTests: new Set(coverage.tests),
    });
    buttons.undo.disabled = !History.canUndo(history);
    buttons.redo.disabled = !History.canRedo(history);
    renderStatus();
  }

  function renderStatus() {
    const { matrix } = history.present;
    const time = savedAt && savedAt.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    status.textContent = [
      `条件 ${matrix.rows.length}行・試験 ${matrix.testCount}列`,
      savedAt ? `ブラウザ内に保存しました（${time}）` : 'ブラウザ内に保存できません。Markdown出力でバックアップしてください',
    ].join('　｜　');
  }

  // 変更のたびにブラウザ内へ保存する
  function save() {
    savedAt = AutoSave.save(history.present.matrix) ? new Date() : null;
  }

  // データを変える操作。変わらなければ履歴に積まない。編集すると警告の強調表示は消える
  function update(operation) {
    const matrix = operation(history.present.matrix);
    if (matrix === history.present.matrix) return render();
    history = History.push(history, { matrix, warnings: [] });
    save();
    render();
  }

  function undo() {
    history = History.undo(history);
    save();
    render();
  }

  function redo() {
    history = History.redo(history);
    save();
    render();
  }

  // Markdownを読み込む。読み込めたら1回の操作として履歴に積む
  function importMarkdown(text) {
    const result = MarkdownFormat.parse(text);
    if (!result.ok) return result;
    const matrix = Matrix.withIds(result.matrix);
    const changed = Checks.compareLeft(history.present.matrix, matrix);
    if (changed) result.warnings.push(changed);
    history = History.push(history, { matrix, warnings: result.warnings });
    save();
    render();
    return result;
  }

  buttons.undo.addEventListener('click', undo);
  buttons.redo.addEventListener('click', redo);

  render();
  return { importMarkdown };
})();

</script>
